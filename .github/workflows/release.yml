# Builds Claude Island with tmux inside and publishes it as a GitHub release, which install.sh downloads.
# Push a version tag to run it:  git tag v1.1 && git push origin v1.1
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macOS 26 with Xcode 26: the app records the SDK it was built with, and macOS only gives apps built
    # with the 26 SDK or later the current (Liquid Glass) controls.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check the SDK
        run: |
          sdk=$(xcrun --show-sdk-version)
          echo "Building with the macOS $sdk SDK"
          [ "${sdk%%.*}" -ge 26 ] || { echo "Need the macOS 26 SDK or later for the current look"; exit 1; }

      - name: Build tmux
        run: ./scripts/build-tmux.sh

      - name: Build the app
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh --package

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Claude-Island.zip --title "Claude Island ${GITHUB_REF_NAME#v}" --generate-notes
