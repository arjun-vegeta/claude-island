# Claude Island's tmux server (socket "claude-island"): one tmux session per Claude Code session.
# Set up to feel like plain Terminal: no status bar, no prefix key, normal scrolling.

# No prefix key, so every keystroke reaches Claude (it uses Ctrl+B to background tasks).
set -g prefix None
set -g prefix2 None
unbind C-b

set -g status off
set -g escape-time 0
set -g focus-events on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -g window-size latest
set -g detach-on-destroy on

# Pass Claude's window title ("✳ Fix the login bug") through to the Terminal window.
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# Bells and notifications reach Terminal as usual.
set -g bell-action any
set -g visual-bell off
set -g allow-passthrough on

# Trackpad scrolls back through history; drag to select copies to the clipboard.
set -g mouse on
unbind -n MouseDown3Pane
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode Escape send -X cancel

# Clicking a link opens it. tmux takes clicks for the trackpad scrolling above, so Terminal can't open
# links itself (not even with ⌘); open-link opens the one under the click, then the click goes on to
# Claude as before.
bind -n MouseUp1Pane {
    run-shell -b 'MOUSE_LINK=#{q:mouse_hyperlink} MOUSE_LINE=#{q:mouse_line} MOUSE_X=#{mouse_x} "$HOME/claude-island/shell/open-link"'
    send-keys -M
}

# Closing the Terminal window ends the Claude session in it, as it did before tmux. Reorganise switches
# windows between sessions instead of disconnecting them, so it never ends anything.
set-hook -g client-detached 'if-shell -F "#{session_attached}" "" "kill-session"'
